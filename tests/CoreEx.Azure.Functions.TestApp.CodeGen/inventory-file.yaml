# yaml-language-server: $schema=../../schema/coreex-files.json
name: Inventory
version: '1'
runtimeProjectPath: ../CoreEx.Azure.Functions.TestApp
runtimePath: InventoryImports/Files
runtimeNamespace: CoreEx.Azure.Functions.TestApp.InventoryImports
mode: ValidateThenExecute
errorMode: CollectErrors
limits:
  maxInputBytes: 1048576
records:
- name: Adjustment
  properties:
  - { name: CommandId, mandatory: true, maxLength: 100 }
  - { name: Sku, mandatory: true, maxLength: 100 }
  - { name: Quantity, type: Integer, required: true, min: 1 }
