name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'gen/**'
      - 'servicebus/**'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'docker-compose.yml'
      - '*.slnf'
      - '*.slnx'
      - '.config/dotnet-tools.json'
      - '.github/workflows/CI.yml'
      - 'tools/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'gen/**'
      - 'servicebus/**'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'docker-compose.yml'
      - '*.slnf'
      - '*.slnx'
      - '.config/dotnet-tools.json'
      - '.github/workflows/CI.yml'
      - 'tools/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  core-unit:
    name: Core unit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        dotnet-version: |
          8.x
          9.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore .NET tools
      run: dotnet tool restore

    - name: Restore core
      run: dotnet restore CoreEx.Core.slnf --verbosity minimal

    - name: Build core
      run: dotnet build CoreEx.Core.slnf --no-restore --configuration Release

    - name: Verify checked-in Functions File CodeGen
      working-directory: tests/CoreEx.Azure.Functions.TestApp.CodeGen
      run: dotnet run --no-build --configuration Release -- file --expect-no-changes

    - name: Test core unit
      run: dotnet test CoreEx.Core.Test.Parallel.slnf --no-build --configuration Release --logger trx --collect "XPlat Code Coverage" --results-directory coverage/core-unit

    - name: Upload core unit test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: core-unit-test-results
        path: "coverage/core-unit/**/*.trx"
        retention-days: 30

    - name: Upload core unit coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-core-unit
        path: "coverage/core-unit/**/coverage.cobertura.xml"
        if-no-files-found: error
        retention-days: 7

  core-infrastructure:
    name: Core infrastructure (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]

    steps:
    - uses: actions/checkout@v4

    - name: Start containers
      run: docker compose up -d db-sql-server db-postgres redis-cache servicebus-emulator cosmos-emulator

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        dotnet-version: |
          8.x
          9.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-

    # Narrow multi-target dependencies without overriding the generator's netstandard2.0 target.
    - name: Restore core infrastructure
      run: dotnet restore CoreEx.Core.Test.Sequential.slnf -p:CoreExTargetFrameworks=${{ matrix.framework }} --verbosity minimal

    - name: Build core infrastructure
      run: dotnet build CoreEx.Core.Test.Sequential.slnf --no-restore --configuration Release -p:CoreExTargetFrameworks=${{ matrix.framework }}

    - name: Test core infrastructure
      run: dotnet test CoreEx.Core.Test.Sequential.slnf --no-build --framework ${{ matrix.framework }} --configuration Release -p:CoreExTargetFrameworks=${{ matrix.framework }} --logger trx --collect "XPlat Code Coverage" --results-directory coverage/core-infrastructure-${{ matrix.framework }} -m:1 -p:TestTfmsInParallel=false -p:BuildInParallel=false

    - name: Upload core infrastructure test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: core-infrastructure-test-results-${{ matrix.framework }}
        path: "coverage/core-infrastructure-${{ matrix.framework }}/**/*.trx"
        retention-days: 30

    - name: Upload core infrastructure coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-core-infrastructure-${{ matrix.framework }}
        path: "coverage/core-infrastructure-${{ matrix.framework }}/**/coverage.cobertura.xml"
        if-no-files-found: error
        retention-days: 7

    - name: Capture container logs on failure
      if: failure()
      run: docker compose logs --no-color > container-logs.txt 2>&1

    - name: Upload container logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: container-logs-core-infrastructure-${{ matrix.framework }}
        path: container-logs.txt
        retention-days: 30

    - name: Stop containers
      if: always()
      run: docker compose down

  samples:
    name: Samples (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]

    steps:
    - uses: actions/checkout@v4

    - name: Start containers
      run: docker compose up -d

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        dotnet-version: |
          8.x
          9.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Build samples
      run: dotnet build CoreEx.Samples.Build.slnf --configuration Release -m:1

    - name: CodeGen tool (samples/src/Contoso.Products.CodeGen)
      working-directory: samples/src/Contoso.Products.CodeGen
      run: dotnet run refdata --no-build --configuration Release -f net10.0 --expect-no-changes

    - name: CodeGen tool (samples/src/Contoso.Shopping.CodeGen)
      working-directory: samples/src/Contoso.Shopping.CodeGen
      run: dotnet run refdata --no-build --configuration Release -f net10.0 --expect-no-changes

    - name: CodeGen tool (samples/src/Contoso.Customers.CodeGen)
      working-directory: samples/src/Contoso.Customers.CodeGen
      run: dotnet run refdata --no-build --configuration Release -f net10.0 --expect-no-changes

    - name: Database tool (samples/src/Contoso.Products.Database)
      working-directory: samples/src/Contoso.Products.Database
      run: dotnet run all --no-build --configuration Release -f net10.0 --expect-no-changes

    - name: Database tool (samples/src/Contoso.Shopping.Database)
      working-directory: samples/src/Contoso.Shopping.Database
      run: dotnet run all --no-build --configuration Release -f net10.0 --expect-no-changes

    - name: Database tool (samples/src/Contoso.Orders.Database)
      working-directory: samples/src/Contoso.Orders.Database
      run: dotnet run all --no-build --configuration Release -f net10.0 --expect-no-changes

    - name: Wait for Cosmos emulator
      timeout-minutes: 6
      run: |
        # The vNext emulator reports readiness (gateway + explorer + backing store) on its health port (moved to 8083 in docker-compose.yml to avoid the DTS emulator on 8080).
        until curl -sf http://localhost:8083/ready -o /dev/null; do
          echo "Waiting for the Cosmos emulator..."; sleep 5
        done

    - name: Database tool (samples/src/Contoso.Customers.Database)
      working-directory: samples/src/Contoso.Customers.Database
      run: dotnet run all --no-build --configuration Release -f net10.0

    - name: Test samples
      run: dotnet test CoreEx.Samples.Test.slnf --no-build --framework ${{ matrix.framework }} --configuration Release --logger trx --collect "XPlat Code Coverage" --results-directory coverage/samples -m:1 -p:TestTfmsInParallel=false -p:BuildInParallel=false

    - name: Upload samples test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: samples-test-results-${{ matrix.framework }}
        path: "coverage/samples/**/*.trx"
        retention-days: 30

    - name: Upload samples coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-samples-${{ matrix.framework }}
        path: "coverage/samples/**/coverage.cobertura.xml"
        if-no-files-found: error
        retention-days: 7

    - name: Capture container logs on failure
      if: failure()
      run: docker compose logs --no-color > container-logs.txt 2>&1

    - name: Upload container logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: container-logs-samples-${{ matrix.framework }}
        path: container-logs.txt
        retention-days: 30

    - name: Stop containers
      if: always()
      run: docker compose down

  samples-e2e:
    name: Samples E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Start containers
      run: docker compose --profile search up -d

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        dotnet-version: |
          8.x
          9.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Build samples E2E
      run: dotnet build CoreEx.Samples.Build.slnf --configuration Release -m:1

    # Products, Shopping, and Customers are provisioned by the Aspire fixture before startup.
    - name: Database tool (samples/src/Contoso.Orders.Database)
      working-directory: samples/src/Contoso.Orders.Database
      run: dotnet run all --no-build --configuration Release -f net10.0 --expect-no-changes

    - name: Wait for Cosmos emulator
      timeout-minutes: 6
      run: |
        until curl -sf http://localhost:8083/ready -o /dev/null; do
          echo "Waiting for the Cosmos emulator..."; sleep 5
        done

    # The E2E hosts call each other over https using the ASP.NET Core dev certificate, which 'dotnet dev-certs https --trust' can't trust on Linux; add it to the system store instead.
    - name: Trust ASP.NET Core dev certificate
      run: |
        dotnet dev-certs https
        dotnet dev-certs https --export-path aspnetcore-dev.pem --format Pem --no-password
        sudo cp aspnetcore-dev.pem /usr/local/share/ca-certificates/aspnetcore-dev.crt
        sudo update-ca-certificates
        rm aspnetcore-dev.pem

    - name: Prepare semantic search model
      timeout-minutes: 10
      run: docker compose exec -T ollama ollama pull nomic-embed-text:v1.5

    - name: Test samples (Aspire end-to-end, net10.0 only)
      timeout-minutes: 20
      run: dotnet test CoreEx.Samples.Test.E2E.slnf --no-build --configuration Release --logger trx --results-directory coverage/samples-e2e -m:1 -p:TestTfmsInParallel=false -p:BuildInParallel=false

    - name: Upload samples test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: samples-e2e-test-results
        path: "coverage/samples-e2e/**/*.trx"
        retention-days: 30

    - name: Capture container logs on failure
      if: failure()
      run: docker compose --profile search logs --no-color > container-logs.txt 2>&1

    - name: Upload container logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: container-logs-samples-e2e
        path: container-logs.txt
        retention-days: 30

    - name: Stop containers
      if: always()
      run: docker compose --profile search down

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [core-unit, core-infrastructure, samples]
    if: ${{ always() && !cancelled() }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Restore .NET tools
      run: dotnet tool restore

    - name: Download coverage
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-*
        path: coverage

    - name: Merge and generate coverage report
      run: |
        dotnet tool run reportgenerator \
          -reports:"coverage/**/coverage.cobertura.xml" \
          -targetdir:"coverage/report" \
          -reporttypes:"HtmlInline_AzurePipelines;Cobertura;Badges" \
          -assemblyfilters:"-*Test*;-*E2E*"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/report
        if-no-files-found: error
        retention-days: 30

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [core-unit, core-infrastructure, samples, samples-e2e, functions-runtime, template-validation, coverage]
    if: ${{ always() }}
    steps:
    - name: Require every CI job to succeed
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
        echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")'

  functions-runtime:
    name: Functions runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASPIRE_CONTAINER_RUNTIME: docker
      FUNCTIONS_CORE_TOOLS_TELEMETRY_OPTOUT: '1'

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        dotnet-version: |
          8.x
          9.x

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Functions Core Tools
      run: |
        npm install --global azure-functions-core-tools@4.16.0
        func --version

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Test Functions runtime (HTTP, Service Bus and Blob CSV)
      run: dotnet test tests/aspire/CoreEx.Azure.Functions.Test.Aspire/CoreEx.Azure.Functions.Test.Aspire.csproj --configuration Release --logger trx --results-directory coverage/functions-runtime --verbosity minimal

    - name: Upload Functions runtime test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: functions-runtime-test-results
        path: "coverage/functions-runtime/**/*.trx"
        retention-days: 30

  template-validation:
    name: Template validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        dotnet-version: |
          8.x
          9.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-template-${{ hashFiles('src/CoreEx.Template/**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-template-

    - name: Validate template pack
      shell: pwsh
      run: tools/validate-template-pack.ps1

    - name: Upload failed test dirs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: template-validation-failures
        path: ${{ runner.temp }}/cxval-*
        retention-days: 7
