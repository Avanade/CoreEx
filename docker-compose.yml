name: CoreEx

services:
  db-sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "yourStrong(!)Password"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    
  db-postgres:
    image: postgres
    environment:
      POSTGRES_PASSWORD: "yourStrong#!Password"
    ports:
      - "5432:5432"

  redis-cache:
    image: docker.io/redis:latest
    ports:
      - "6379:6379"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    ports:
      - "18888:18888"
      - "4317:18889"

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - db-sql-server
    volumes:
      - ./servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    environment:
      SQL_SERVER: db-sql-server
      MSSQL_SA_PASSWORD: "yourStrong(!)Password"
      ACCEPT_EULA: "Y"
    ports:
      - "5672:5672"   # AMQP
      - "5300:5300"   # Management / HTTP

  dts-emulator:
    image: mcr.microsoft.com/dts/dts-emulator:latest
    environment:
      DTS_TASK_HUB_NAMES: "default,order"
    ports:
      - "8080:8080"
      - "8082:8082"

  # Used by CoreEx.Cosmos.Test.Unit. Note: under rootless Podman this image can be flaky with the default bridge
  # network (its TLS certificate is issued for the IP(s) it discovers at startup, which may not match the
  # container's mapped/published address) - if `podman compose up -d cosmos-emulator` doesn't come up cleanly,
  # try re-running with `--privileged` or host networking. Clients also need to accept the emulator's
  # self-signed certificate (e.g. CosmosClientOptions with a permissive ServerCertificateCustomValidationCallback)
  # rather than relying on the emulator's own IP-override/cert-export workarounds.
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: "10"
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "false"
      AZURE_COSMOS_EMULATOR_IP_ADDRESS_OVERRIDE: "127.0.0.1"
    ports:
      - "8081:8081"
      - "10251-10254:10251-10254"