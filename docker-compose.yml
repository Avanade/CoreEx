name: CoreEx

services:
  db-sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "yourStrong(!)Password"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    
  db-postgres:
    image: docker.io/pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_PASSWORD: "yourStrong#!Password"
    ports:
      - "5432:5432"

  redis-cache:
    image: docker.io/redis:latest
    ports:
      - "6379:6379"

  ollama:
    image: docker.io/ollama/ollama:0.13.5
    profiles: ["search"]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    ports:
      - "18888:18888"
      - "4317:18889"

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - db-sql-server
    volumes:
      - ./servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    environment:
      SQL_SERVER: db-sql-server
      MSSQL_SA_PASSWORD: "yourStrong(!)Password"
      ACCEPT_EULA: "Y"
    ports:
      - "5672:5672"   # AMQP
      - "5300:5300"   # Management / HTTP

  dts-emulator:
    image: mcr.microsoft.com/dts/dts-emulator:latest
    environment:
      DTS_TASK_HUB_NAMES: "default,order"
    ports:
      - "8080:8080"
      - "8082:8082"

  # Used by CoreEx.Cosmos.Test.Unit and the Customers domain. This is the Linux "vNext" emulator (the legacy
  # image with its ~35 container cap and long-uptime wedging is no longer used). The .NET SDK only speaks HTTPS, and
  # vNext defaults to HTTP, hence `--protocol https` (self-signed certificate; clients must accept it).
  # The health probe defaults to 8080 which clashes with dts-emulator, so it is moved to 8083 (/ready).
  # Host networking is used because rootless Podman on Windows (WSL) does not forward the TLS gateway port
  # correctly via published ports (the TLS handshake is aborted); it also works as-is with Docker on Linux (CI).
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    command: ["--protocol", "https", "--health-port", "8083"]
    network_mode: host

volumes:
  ollama-models:
