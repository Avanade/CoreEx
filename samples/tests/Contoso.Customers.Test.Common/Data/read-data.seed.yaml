- { id: ^13, firstName: Charlie, lastName: Clarke, email: charlie.clarke@example.com, customerTypeCode: ORG, contactMethodCode: SMS, hasShopped: false }
- { id: ^14, firstName: Diana, lastName: Davis, email: diana.davis@example.com, customerTypeCode: ORG, contactMethodCode: EM, hasShopped: true }
- { id: ^15, firstName: Alice, lastName: Edwards, email: alice.edwards@example.com, customerTypeCode: IND, contactMethodCode: PO, hasShopped: false }
