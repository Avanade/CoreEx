# Cosmos 'customers' container rows for CustomerReadTests (Get + Query) - raw camelCase document shape (matches Contoso.Customers.Infrastructure.Persistence.Customer's JSON property names), imported
# directly via CosmosDbBatch.ImportBatchAsync. Read-only fixture - every test here only reads, so all rows are freely shareable across tests. No 'partitionKey' property on any row (PartitionKey.None -
# see mutate-data.seed.yaml's equivalent note). Distinct leading letters on lastName support startswith/endswith/contains filter + ordering assertions; two rows share firstName "Alice" to prove
# multi-match filtering and the LastName tie-break order.
customers:
