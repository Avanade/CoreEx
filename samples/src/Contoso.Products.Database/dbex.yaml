# yaml-language-server: $schema=https://raw.githubusercontent.com/Avanade/DbEx/refs/heads/main/schema/dbex.json
schema: products
outbox: true
outboxName: outbox
tables:
# Reference-data
- name: brand
- name: category
- name: movement_kind
- name: movement_status
- name: sub_category
- name: unit_of_measure

# Transactional-data
- name: inventory
- name: movement
- name: product
  columns:
  - name: tags_json     # native JSONB (Postgres) — deliberate override of the bounded-text default, since Postgres JSON operators/indexing are wanted here
    property: Tags
    type: List<string>?