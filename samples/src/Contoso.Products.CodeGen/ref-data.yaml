# yaml-language-server: $schema=https://raw.githubusercontent.com/Avanade/CoreEx/refs/heads/main/schema/coreex-refdata.json
collectionSortOrder: Code
repository: EntityFramework
getNamed: true
entities:
- name: Brand
  mutability: CreateUpdateDelete
  mutableAttribute: '[AllowAnonymous]' # This sample API has no authentication; production APIs should retain the default [Authorize].
- name: Category
- name: MovementKind
- name: MovementStatus
- name: SubCategory
  properties:
  - name: CategoryCode
    type: ^Category
- name: UnitOfMeasure
  plural: UnitsOfMeasure
  properties:
  - name: Scale
    type: int
